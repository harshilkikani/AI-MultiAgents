# Why this exists: CI for the revival/ subtree only. Runs on any push that
# touches revival/** so the existing MultiAgents demo doesn't pay for
# Lead Revival test time.
name: Revival CI

on:
  push:
    paths:
      - 'revival/**'
      - '.github/workflows/revival-ci.yml'
  pull_request:
    paths:
      - 'revival/**'
      - '.github/workflows/revival-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revival/backend

    # Stand up Postgres so the tests + migrations exercise the real engine,
    # not just SQLite. SQLite stays supported for local dev.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revival
          POSTGRES_PASSWORD: revival
          POSTGRES_DB: revival_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Tests still default to the tmp_path-created SQLite URL set by the
      # test fixtures. This URL is used only for the migration smoke test.
      PG_URL: postgresql+psycopg://revival:revival@localhost:5432/revival_test
      REVIVAL_TEST_BYPASS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: revival/backend/requirements.txt

      - run: pip install -r requirements.txt

      - run: python scripts/gen_sample_csv.py

      # Exercise Alembic end-to-end against Postgres so a broken migration
      # can never ship.
      - name: Run migrations against Postgres
        run: DATABASE_URL="$PG_URL" alembic upgrade head

      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revival/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: revival/frontend/package-lock.json

      - run: npm install --no-audit --no-fund
      - run: npm run build
